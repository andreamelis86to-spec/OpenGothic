name: OpenGothic Touch v3 (dialoghi e margini)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VK_SDK: '1.4.357.0'

jobs:
  android-touch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The fork pins an older Tempest commit. Touch diagnostic markers below
      # are based on the recent Tempest Android input implementation.
      - name: Use current Tempest Android touchscreen source
        shell: bash
        run: |
          git -C lib/Tempest fetch --depth=1 origin master
          git -C lib/Tempest checkout --detach FETCH_HEAD
          echo "Tempest commit: $(git -C lib/Tempest rev-parse --short HEAD)"
          test -f lib/Tempest/Engine/system/api/androidapi.cpp
          grep -F '#include <android/input.h>' lib/Tempest/Engine/system/api/androidapi.cpp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - uses: ./.github/actions/setup-vulkan
        with:
          os: Linux
          vk-sdk: ${{ env.VK_SDK }}

      - name: Install Android build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Apply touchscreen controls (build only)
        shell: bash
        run: |
          base64 -d > /tmp/open-gothic-touch.patch <<'TOUCH_PATCH'
