      - name: Diagnose Android native touchscreen dispatch
        shell: bash
        run: |
          python3 - <<'PYTOUCH'
          from pathlib import Path

          def change(path, old, new):
              p = Path(path)
              txt = p.read_text()
              if old not in txt:
                  raise RuntimeError(f"Unsupported source revision, snippet not found in {path}: {old[:100]!r}")
              p.write_text(txt.replace(old, new, 1))
              print('Patched', path)

          native = 'lib/Tempest/Engine/system/api/androidapi.cpp'
          change(native, '#include <android/input.h>', '#include <android/input.h>\n#include <android/log.h>')
          change(native,
                 '  if(AInputEvent_getType(event)!=AINPUT_EVENT_TYPE_MOTION ||\n'
                 '     (AInputEvent_getSource(event) & AINPUT_SOURCE_TOUCHSCREEN)!=AINPUT_SOURCE_TOUCHSCREEN)\n'
                 '    return 0;',
                 '  if(AInputEvent_getType(event)!=AINPUT_EVENT_TYPE_MOTION)\n'
                 '    return 0;\n'
                 '  // Accept touchscreen and related pointer sources for diagnostic purposes.\n'
                 '  // Only primary touchscreen gestures are used for touch controls.\n')
          change(native,
                 '  const int32_t index  = AMotionEvent_getPointerIndex(event);',
                 '  const int32_t index  = AMotionEvent_getPointerIndex(event);\n'
                 '  if(action==AMOTION_EVENT_ACTION_DOWN || action==AMOTION_EVENT_ACTION_POINTER_DOWN)\n'
                 '    __android_log_print(ANDROID_LOG_INFO,"OGTouch","native DOWN action=%d source=0x%x x=%.0f y=%.0f",\n'
                 '                        action,unsigned(AInputEvent_getSource(event)),\n'
                 '                        double(AMotionEvent_getX(event,index)), double(AMotionEvent_getY(event,index)));')
          change(native,
                 '      SystemApi::dispatchMouseDown(*mainWindow,e);',
                 '      __android_log_print(ANDROID_LOG_INFO,"OGTouch","dispatch DOWN x=%d y=%d",t.moveLast.x,t.moveLast.y);\n'
                 '      SystemApi::dispatchMouseDown(*mainWindow,e);')
          change(native,
                 '      SystemApi::dispatchMouseUp(*mainWindow,e);',
                 '      __android_log_print(ANDROID_LOG_INFO,"OGTouch","dispatch UP x=%d y=%d",t.moveLast.x,t.moveLast.y);\n'
                 '      SystemApi::dispatchMouseUp(*mainWindow,e);')

          touch='common/ui/touchinput.cpp'
          change(touch, '#include <algorithm>', '#if defined(__ANDROID__)\n#include <android/log.h>\n#endif\n#include <algorithm>')
          change(touch,
                 '  auto hit=hitTest(e.pos(),mode);',
                 '  auto hit=hitTest(e.pos(),mode);\n'
                 '#if defined(__ANDROID__)\n'
                 '  __android_log_print(ANDROID_LOG_INFO,"OGTouch","widget DOWN x=%d y=%d mode=%d hit=%d",\n'
                 '                      e.pos().x,e.pos().y,mode,int(hit));\n'
                 '#endif')
          menu='common/ui/menuroot.cpp'
          change(menu, '#include "menuroot.h"', '#include "menuroot.h"\n#if defined(__ANDROID__)\n#include <android/log.h>\n#endif')
          change(menu,
                 'void MenuRoot::mouseDownEvent(MouseEvent& event) {',
                 'void MenuRoot::mouseDownEvent(MouseEvent& event) {\n'
                 '#if defined(__ANDROID__)\n'
                 '  __android_log_print(ANDROID_LOG_INFO,"OGTouch","menu DOWN x=%d y=%d",event.pos().x,event.pos().y);\n'
                 '#endif')
          PYTOUCH

      - name: Generate build version
        run: |
          echo '#pragma once' > game/build.h
          echo 'static const char* appBuild = "OpenGothic touch v3 dialogue layout";' >> game/build.h

      - name: Configure
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build test APK
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build/android --target OpenGothic-apk

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: OpenGothic-Android-Touch-v3-dialoghi-margini
          path: build/android/OpenGothic-apk/build/outputs/apk/release/OpenGothic-apk-release.apk
          if-no-files-found: error
